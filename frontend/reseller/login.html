<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reseller Login | SkulWave</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login2.css">
</head>

<body>
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap animated fadeIn container">
                <h1>Reseller Login</h1>
                <p class="login-subtitle">Sign in to sell SkulWave vouchers.</p>
                <form id="loginForm" name="resellerLogin">
                    <label>
                        <img class="ico" src="../img/user.svg" alt="Username" />
                        <input name="username" type="text" placeholder="Reseller Username" required />
                    </label>
                    <label>
                        <img class="ico" src="../img/password.svg" alt="Password" />
                        <input name="password" type="password" placeholder="Reseller Password" required />
                    </label>
                    <button type="submit" class="submit-btn">Continue</button>
                </form>
                <p class="login-note">This page is for authorized SkulWave resellers.</p>
            </div>
        </div>
    </div>
    <footer>
        <p class="info bt">Powered by SkulWave Technologies</p>
    </footer>
    <script src="../js/reseller/login.js"></script>
</body>

</html>
