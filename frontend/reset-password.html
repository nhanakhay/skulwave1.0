<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Change temporary password | SkulWave</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="stage" style="max-width:500px;min-height:auto">
    <section class="form-panel" style="position:relative;width:100%;padding:52px 40px">
      <div class="inner">
        <div class="eyebrow">SkulWave · Account</div><h1>Set a new password</h1>
        <p class="lede">Your temporary password must be replaced before you can buy a package.</p>
        <form id="passwordChangeForm">
          <div class="field"><label for="newPassword">New password</label><input id="newPassword" name="password" type="password" minlength="6" required></div>
          <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirm_password" type="password" minlength="6" required></div>
          <button class="submit" type="submit">Save new password</button><p id="passwordMessage" class="lede" style="margin-top:16px"></p>
        </form>
      </div>
    </section>
  </main>
  <script src="js/reset-password.js"></script>
</body>
</html>
