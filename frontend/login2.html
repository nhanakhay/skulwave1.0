<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkulWave Log in</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>


    <form name="sendin" action="$(link-login-only)" method="post" style="display:none">
        <input type="hidden" name="username" />
        <input type="hidden" name="password" />
        <input type="hidden" name="dst" value="$(link-orig)" />
        <input type="hidden" name="popup" value="true" />
    </form>

    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap animated fadeIn">
                <form name="login" onsubmit="return handleLogin(event)">
                    <input type="hidden" name="dst" value="$(link-orig)" />
                    <input type="hidden" name="popup" value="true" />


                    <img src="img/skulwaveLogo.png" alt="SkulWave Logo" class="logo" />
                    <label>
                        <img class="ico" src="img/user.svg" alt="#" />
                        <input name="username" type="text" placeholder="Username" />
                    </label>

                    <label>
                        <img class="ico" src="img/password.svg" alt="#" />
                        <input name="password" type="password" placeholder="Password" />
                        <span class="password-toggle" onclick="togglePassword()" title="Show password">👁</span>
                    </label>

                    <button type="submit" id="loginBtn" class="submit-btn">Login</button>
                    
                    <div id="loginLoading" class="loading-spinner" style="display: none;">
                        <div class="spinner"></div>
                        <p>Connecting...</p>
                    </div>
                </form>


            </div>
        </div>
    </div>
    <footer>
        <p class="info bt">Powered by SkulWave Technologies</p>
    </footer>
</body>
<script src="/md5.js"></script>
<script src="js/login.js"></script>

</html>
