<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | SkulWave</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/login2.css" />
</head>
<body>
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap animated fadeIn container">
                <h1>Admin Login</h1>
                <form name="adminLogin" onsubmit="return handleAdminLogin(event)">
                    <label>
                        <img class="ico" src="../img/user.svg" alt="Username" />
                        <input name="username" type="text" placeholder="Admin Username" />
                    </label>
                    <label>
                        <img class="ico" src="../img/password.svg" alt="Password" />
                        <input name="password" type="password" placeholder="Admin Password" />
                        <span class="password-toggle" onclick="togglePassword()" title="Show password">👁</span>
                    </label>
                    <button type="submit" id="adminLoginBtn" class="submit-btn">Continue</button>
                    <div id="adminLoginLoading" class="loading-spinner">
                        <div class="spinner"></div>
                        <p>Checking credentials...</p>
                    </div>
                </form>
                <p style="color:#333; margin-top:12px; font-size:14px; text-align:center;">This page is for administrators only.</p>
            </div>
        </div>
    </div>
    <footer>
        <p class="info bt">Powered by SkulWave Technologies</p>
    </footer>
    <script src="../md5.js"></script>
    <script src="../js/adminlogin.js"></script>
</body>
</html>
