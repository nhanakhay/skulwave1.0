<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Confirming payment | SkulWave</title>
</head>

<body>
    <main style="font-family:system-ui;max-width:520px;margin:80px auto;padding:24px">
        <h1>Confirming your payment</h1>
        <p id="message">Please wait while we confirm your Mobile Money payment and connect you.</p>
        <div id="voucherBox" hidden style="border:2px dashed #c9a15a;border-radius:12px;padding:18px;margin-top:22px;text-align:center;background:#fffaf0"><p style="margin:0 0 8px;font-weight:700">Your hotspot access code</p><strong id="voucherCode" style="font-size:26px;letter-spacing:.08em;user-select:all"></strong><p style="margin:12px 0 0">Copy or take a screenshot of this code, then enter it through the hotspot login page.</p></div>
        <form id="routerLoginForm" method="post"><input name="username" type="hidden"><input name="password"
                type="hidden"><input name="dst" type="hidden"></form>
    </main>
    <script src="callback.js"></script>
</body>

</html>
